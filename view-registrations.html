<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | V & S Garba</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: #C62828; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #FF5722; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .no-data { text-align: center; color: #888; padding: 20px; }
        @media (max-width: 768px) { table { font-size: 12px; } th, td { padding: 8px; } }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Registrations</h2>
    <table id="regTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Age/Gender</th>
                <th>Batch</th>
                <th>Mobile</th>
                <th>Payment</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
    // Firebase Config - Same as Registration Page
    const firebaseConfig = {
        apiKey: "AIzaSyD1tN_i8vdP0CElrtm-Re-W4Nr2yLSqzhU",
        databaseURL: "https://vns-garba-and-dodhiya-classes-default-rtdb.firebaseio.com",
        projectId: "vns-garba-and-dodhiya-classes"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Data Fetching
    db.ref('registrations').on('value', (snapshot) => {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = ''; // Clear table before updating

        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                const data = child.val();
                const row = `<tr>
                    <td>${data.name}</td>
                    <td>${data.age || 'N/A'}</td>
                    <td>${data.batch}</td>
                    <td>${data.phone}</td>
                    <td>${data.payment || 'Online'}</td>
                    <td>${data.date}</td>
                </tr>`;
                tableBody.innerHTML += row;
            });
        } else {
            tableBody.innerHTML = '<tr><td colspan="6" class="no-data">No registrations found yet.</td></tr>';
        }
    });
</script>
</body>
</html>
