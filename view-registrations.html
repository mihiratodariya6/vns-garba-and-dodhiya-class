<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Dashboard | V & S Garba</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        h2 { color: #C62828; margin: 0; text-transform: uppercase; font-weight: 800; font-size: 24px; }
        
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; font-family: 'Poppins', sans-serif; display: flex; align-items: center; gap: 5px; font-size: 13px;}
        .btn-refresh { background: #2196F3; }
        .btn-refresh:hover { background: #1976D2; box-shadow: 0 4px 10px rgba(33, 150, 243, 0.3); }
        .btn-history { background: #4CAF50; }
        .btn-history:hover { background: #388E3C; box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3); }
        .btn-reset { background: #f44336; }
        .btn-reset:hover { background: #d32f2f; box-shadow: 0 4px 10px rgba(244, 67, 54, 0.3); }

        .table-responsive { overflow-x: auto; width: 100%; border-radius: 10px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #ddd; text-align: left; font-size: 13px; vertical-align: top; }
        th { background-color: #ff5722; color: white; white-space: nowrap; font-weight: 600; }
        tr:nth-child(even) { background-color: #fcfcfc; }
        tr:hover { background-color: #f1f1f1; }
        
        .no-data { text-align: center; color: #888; padding: 40px !important; font-style: italic; font-size: 15px; }
        
        .token-badge { background: #333; color: #ff9800; padding: 4px 8px; border-radius: 6px; font-weight: bold; letter-spacing: 1px; font-size: 14px; }
        
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 20px; font-size: 11.5px; font-weight: bold; color: white; text-align: center; margin-top: 5px; letter-spacing: 0.5px;}
        .status-pending { background: #ff9800; box-shadow: 0 2px 5px rgba(255,152,0,0.3); } 
        .status-approved { background: #2196F3; box-shadow: 0 2px 5px rgba(33,150,243,0.3); } 
        .status-paid { background: #4CAF50; box-shadow: 0 2px 5px rgba(76,175,80,0.4); } 
        
        .student-list { list-style: none; padding: 0; margin: 0; }
        .student-list li { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #eee; }
        .student-list li:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .amount-text { font-size: 16px; font-weight: 800; color: #c62828; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2><i class="fas fa-users-cog"></i> Live Admin Dashboard</h2>
        <div class="btn-group">
            <button class="btn btn-refresh" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refresh Live Data</button>
            <button class="btn btn-history" onclick="downloadHistory()"><i class="fas fa-file-excel"></i> Download History</button>
            <button class="btn btn-reset" onclick="resetData()"><i class="fas fa-eye-slash"></i> Clear Dashboard</button>
        </div>
    </div>

    <div class="table-responsive">
        <table id="regTable">
            <thead>
                <tr>
                    <th>Token & Date</th>
                    <th>Students Details</th>
                    <th>Registration Type & Plan</th>
                    <th>Batch & Leader Contact</th>
                    <th>Payment Method</th>
                    <th>Total Fees & Status</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="6" class="no-data">Loading Live Data... <i class="fas fa-spinner fa-spin"></i></td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD1tN_i8vdP0CElrtm-Re-W4Nr2yLSqzhU",
        databaseURL: "https://vns-garba-and-dodhiya-classes-default-rtdb.firebaseio.com",
        projectId: "vns-garba-and-dodhiya-classes"
    };
    
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    function renderTable(snapshot) {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = ''; 

        if (snapshot.exists()) {
            let records = [];
            snapshot.forEach((child) => {
                records.push(child.val());
            });

            let visibleCount = 0;

            records.reverse().forEach((data) => {
                // અહીંયા લોજીક છે: જો ડેટા 'archived' (છુપાવેલો) હોય તો ડેશબોર્ડમાં નહિ બતાવે!
                if(data.archived === true) return; 

                visibleCount++;
                let studentsHTML = `<ul class="student-list">`;
                if(data.students && data.students.length > 0) {
                    data.students.forEach((s, index) => {
                        studentsHTML += `<li>
                            <b>${index + 1}. ${s.name}</b> (Age: ${s.age}, ${s.gender})<br>
                            <i class="fas fa-mobile-alt" style="color:#888;"></i> ${s.mobile}
                        </li>`;
                    });
                } else {
                    studentsHTML += `<li>No student data</li>`;
                }
                studentsHTML += `</ul>`;

                let currentStatus = data.status || "Pending Payment";
                let badgeClass = "status-pending";
                
                if (currentStatus.includes("Screenshot") || currentStatus.includes("Paid") || currentStatus.includes("Payment Screenshot Sent")) {
                    badgeClass = "status-paid";
                    currentStatus = "✅ Payment Screenshot Sent";
                } else if (currentStatus.includes("Approved") || currentStatus === "Approve") {
                    badgeClass = "status-approved";
                }

                const row = `<tr>
                    <td>
                        <span class="token-badge">${data.token}</span><br>
                        <div style="margin-top:10px; font-size:11px; color:#666;">
                            <i class="fas fa-calendar-alt"></i> ${data.date ? data.date.split(',')[0] : '-'}<br>
                            <i class="fas fa-clock"></i> ${data.date ? data.date.split(',')[1] : '-'}
                        </div>
                    </td>
                    <td>${studentsHTML}</td>
                    <td>
                        <b>${(data.type || '').toUpperCase()}</b> (${data.totalStudents || 1} Members)<br>
                        <div style="margin-top:5px; color:#ff5722; font-weight:600;"><i class="fas fa-crown"></i> ${data.membershipPlan || 'Navratri Pass'}</div>
                        <small style="color:#777;">${data.membershipValidity || '-'}</small>
                    </td>
                    <td>
                        <b><i class="fas fa-sun" style="color:#ff9800;"></i> ${data.batch || 'N/A'}</b><br>
                        <div style="margin-top:8px;">
                            <i class="fab fa-whatsapp" style="color:#25D366; font-size:16px;"></i> <b>${data.mobile || 'N/A'}</b><br>
                            <i class="fas fa-envelope" style="color:#555;"></i> ${data.email || '-'}
                        </div>
                    </td>
                    <td style="font-weight:bold; color:#444;">
                        ${data.paymentMethod === 'Cash' ? '<i class="fas fa-money-bill-wave" style="color:#4CAF50;"></i> Cash' : '<i class="fas fa-credit-card" style="color:#2196F3;"></i> Online'}
                        ${data.transactionId ? `<br><small style="font-weight:normal; color:#666;">UTR: ${data.transactionId}</small>` : ''}
                    </td>
                    <td>
                        <span class="amount-text">₹${data.totalAmount || 0}</span><br>
                        <span class="status-badge ${badgeClass}">${currentStatus}</span>
                    </td>
                </tr>`;
                tableBody.innerHTML += row;
            });

            if(visibleCount === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" class="no-data"><i class="fas fa-eye-slash" style="font-size:30px; color:#ccc; display:block; margin-bottom:10px;"></i> Dashboard is clear. No new registrations.</td></tr>';
            }
        } else {
            tableBody.innerHTML = '<tr><td colspan="6" class="no-data"><i class="fas fa-folder-open" style="font-size:30px; color:#ccc; display:block; margin-bottom:10px;"></i> No registrations found.</td></tr>';
        }
    }

    db.ref('registrations').on('value', (snapshot) => {
        renderTable(snapshot);
    });

    function refreshData() {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" class="no-data">Refreshing Live Data... <i class="fas fa-spinner fa-spin"></i></td></tr>';
        db.ref('registrations').once('value').then((snapshot) => {
            renderTable(snapshot);
        });
    }

    // SMART HIDE LOGIC (Clear Dashboard but keep data for Payment Portal)
    function resetData() {
        let userConfirm = confirm("⚠️ Dashboard ક્લિયર કરવું છે?\n\nઆનાથી લિસ્ટ ખાલી થઈ જશે, પણ ડેટાબેઝમાં સેવ રહેશે જેથી સ્ટુડન્ટ્સ Payment Portal માં એમની રસીદ જોઈ શકે.");
        
        if(userConfirm) {
            let finalConfirm = prompt("Type 'CLEAR' to confirm:");
            if(finalConfirm === 'CLEAR') {
                
                db.ref('registrations').once('value').then((snapshot) => {
                    let updates = {};
                    snapshot.forEach((child) => {
                        updates[child.key + '/archived'] = true; // આ કમાન્ડ ડેટાને હાઈડ કરે છે, ડીલીટ નહિ કરે!
                    });
                    return db.ref('registrations').update(updates);
                }).then(() => {
                    alert("✅ Dashboard cleared successfully! Data is safe for students.");
                    refreshData();
                }).catch((error) => {
                    alert("❌ Error: " + error.message);
                });
                
            } else {
                alert("Reset cancelled.");
            }
        }
    }

    function downloadHistory() {
        let csvContent = "Token No,Date,Type,Membership Plan,Total Members,Batch,Payment Method,Total Amount,Status,Leader Mobile,Email\n";
        
        db.ref('registrations').once('value').then((snapshot) => {
            if(snapshot.exists()) {
                snapshot.forEach((child) => {
                    let d = child.val();
                    if(d.archived === true) return; // જે હાઈડ છે એ ડાઉનલોડ માં નહિ આવે
                    
                    let date = d.date ? d.date.replace(/,/g, " ") : "-";
                    let type = d.type || "-";
                    let plan = d.membershipPlan || "-";
                    let members = d.totalStudents || 1;
                    let batch = d.batch ? d.batch.replace(/,/g, " ") : "-";
                    let payMethod = d.paymentMethod || "-";
                    let amount = d.totalAmount || 0;
                    let status = d.status || "Pending";
                    let mobile = d.mobile || "-";
                    let email = d.email || "-";
                    
                    csvContent += `${d.token},${date},${type},${plan},${members},${batch},${payMethod},${amount},${status},${mobile},${email}\n`;
                });
                
                let blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                let link = document.createElement("a");
                let url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", "VNS_Registration_History.csv");
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
            } else {
                alert("No data available to download.");
            }
        });
    }
</script>
</body>
</html>
