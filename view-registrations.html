<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Registrations | V&S Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #FFF8F0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: #C62828; text-align: center; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #FF5722; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .no-data { text-align: center; color: #888; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Registrations</h2>
    <table id="regTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Batch</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="regBody">
            </tbody>
    </table>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD1tN_i8vdP0CElrtm-Re-W4Nr2yLSqzhU",
        databaseURL: "https://vns-garba-and-dodhiya-classes-default-rtdb.firebaseio.com",
        projectId: "vns-garba-and-dodhiya-classes"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const regBody = document.getElementById('regBody');

    // ડેટાબેઝમાંથી ડેટા ખેંચવો
    db.ref('registrations').on('value', (snapshot) => {
        regBody.innerHTML = ''; // ટેબલ ખાલી કરો
        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                const data = child.val();
                const row = `<tr>
                    <td>${data.name}</td>
                    <td>${data.phone}</td>
                    <td>${data.batch}</td>
                    <td>${data.date}</td>
                </tr>`;
                regBody.innerHTML += row;
            });
        } else {
            regBody.innerHTML = '<tr><td colspan="4" class="no-data">No registrations yet!</td></tr>';
        }
    });
</script>

</body>
</html>
