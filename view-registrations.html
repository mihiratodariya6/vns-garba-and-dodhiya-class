<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Dashboard | V & S Garba</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 1300px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow-x: auto; }
        h2 { color: #C62828; text-align: center; margin-bottom: 20px; text-transform: uppercase; font-weight: 800; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th, td { padding: 14px; border: 1px solid #ddd; text-align: left; font-size: 0.95rem; }
        th { background-color: #FF5722; color: white; white-space: nowrap; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        .no-data { text-align: center; color: #888; padding: 30px; font-style: italic; }
        .date-col { font-size: 0.85rem; color: #555; }
        .pay-badge { background: #e8f5e9; color: #2e7d32; padding: 4px 8px; border-radius: 4px; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h2>Live Student Registrations</h2>
    <table id="regTable">
        <thead>
            <tr>
                <th>Reg. Date & Time</th>
                <th>Full Name</th>
                <th>Age (DOB)</th>
                <th>Gender</th>
                <th>WhatsApp No.</th>
                <th>Email Address</th>
                <th>Selected Batch</th>
                <th>Payment</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyD1tN_i8vdP0CElrtm-Re-W4Nr2yLSqzhU",
        databaseURL: "https://vns-garba-and-dodhiya-classes-default-rtdb.firebaseio.com",
        projectId: "vns-garba-and-dodhiya-classes"
    };
    
    // Initialize Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Data Fetching (Live Tracking)
    db.ref('registrations').on('value', (snapshot) => {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = ''; // Clear table before updating

        if (snapshot.exists()) {
            snapshot.forEach((child) => {
                const data = child.val();
                
                // HTML Row Creation
                const row = `<tr>
                    <td class="date-col">${data.date || 'N/A'}</td>
                    <td><strong>${data.name || 'N/A'}</strong></td>
                    <td>${data.age || '-'} Yrs <br><small>(${data.dob || '-'})</small></td>
                    <td>${data.gender || 'N/A'}</td>
                    <td style="font-weight: 600;">${data.phone || 'N/A'}</td>
                    <td>${data.email || 'N/A'}</td>
                    <td>${data.batch || 'N/A'}</td>
                    <td><span class="pay-badge">${data.payment || 'N/A'}</span></td>
                </tr>`;
                
                tableBody.innerHTML += row;
            });
        } else {
            tableBody.innerHTML = '<tr><td colspan="8" class="no-data">No registrations found in the database yet.</td></tr>';
        }
    });
</script>
</body>
</html>
