<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V&S Admin Panel - Add Event</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #FFF8F0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .admin-container { width: 100%; max-width: 500px; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 5px solid #FF5722; }
        h2 { text-align: center; color: #C62828; margin-bottom: 5px; text-transform: uppercase; font-weight: 800; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 30px; font-weight: 600; }
        
        label { font-weight: 600; color: #333; display: block; margin-bottom: 8px; font-size: 0.95rem; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 1rem; box-sizing: border-box; background: #fafafa; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #FF5722; outline: none; background: white; box-shadow: 0 0 5px rgba(255, 87, 34, 0.2); }
        input[type="file"], input[type="date"] { cursor: pointer; }
        input[type="file"] { padding: 10px; background: #fff; border: 1px dashed #FF5722; }
        
        button { width: 100%; padding: 15px; background: linear-gradient(45deg, #FF5722, #C62828); color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; transition: 0.3s; text-transform: uppercase; }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(198, 40, 40, 0.4); }
        button:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="admin-container">
        <h2>V&S Admin Panel</h2>
        <p class="subtitle">Post a New Theme Day or Event</p>

        <form id="eventForm">
            <label>Event Title</label>
            <input type="text" id="eventTitle" placeholder="e.g., Garba Class Registration 2026 🔥" required>

            <label>Event Date</label>
            <input type="date" id="eventDate" required>

            <label>Upload Event Image (100% Free)</label>
            <input type="file" id="eventImage" accept="image/*" required>

            <label>Event Details</label>
            <textarea id="eventDesc" rows="4" placeholder="Write what will happen on this day..." required></textarea>

            <button type="submit" id="submitBtn">Publish Event to Website</button>
        </form>
    </div>

    <script>
        // ---------------------------------------------------------
        // ૧. IMGBB API KEY 
        // ---------------------------------------------------------
        const IMGBB_API_KEY = "9f760ae89c17e720f59310f8f38ce7cb"; 

        // ---------------------------------------------------------
        // ૨. FIREBASE CONFIG 
        // ---------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyD1tN_i8vdP0CElrtm-Re-W4Nr2yLSqzhU",
            authDomain: "vns-garba-and-dodhiya-classes.firebaseapp.com",
            databaseURL: "https://vns-garba-and-dodhiya-classes-default-rtdb.firebaseio.com",
            projectId: "vns-garba-and-dodhiya-classes",
            storageBucket: "vns-garba-and-dodhiya-classes.firebasestorage.app",
            messagingSenderId: "29528312835",
            appId: "1:29528312835:web:bf7e6e283c09236df75236",
            measurementId: "G-LQ9GB7GS4J"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function formatMyDate(dateString) {
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            const d = new Date(dateString);
            return d.toLocaleDateString('en-GB', options);
        }

        document.getElementById('eventForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            btn.innerText = "Uploading Image... Please wait ⏳";
            btn.disabled = true;

            try {
                const title = document.getElementById('eventTitle').value;
                const rawDate = document.getElementById('eventDate').value;
                const finalDate = formatMyDate(rawDate); 
                const desc = document.getElementById('eventDesc').value;
                const fileInput = document.getElementById('eventImage');
                const file = fileInput.files[0];

                if (!file) {
                    alert("Please select an image!");
                    btn.innerText = "Publish Event to Website";
                    btn.disabled = false;
                    return;
                }

                // ડાયરેક્ટ ફાઈલ મોકલવાની રીત (મોબાઈલ એરર સોલ્વ કરવા)
                const formData = new FormData();
                formData.append('image', file);

                const imgbbResponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: 'POST',
                    body: formData
                });

                const imgbbData = await imgbbResponse.json();
                
                if(imgbbData.success) {
                    const imageUrl = imgbbData.data.url; 

                    await db.ref('events').push({
                        title: title,
                        date: finalDate,
                        image: imageUrl,
                        desc: desc,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });

                    alert("Boom! 💥 Event & Image Successfully Posted!");
                    document.getElementById('eventForm').reset();
                } else {
                    alert("Image Upload Failed! Error: " + (imgbbData.error ? imgbbData.error.message : "Unknown error"));
                }

            } catch (error) {
                console.error("Error: ", error);
                alert("Something went wrong! " + error.message);
            } finally {
                btn.innerText = "Publish Event to Website";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
